name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3-script-audio-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci
      - run: npm run check
      - name: Generate, validate and materialize synthetic project outside repository
        run: |
          npm run generate -- --input examples/synthetic-node/source.yaml --output "$RUNNER_TEMP/synthetic-project" --synthetic
          npm run validate-script -- --project "$RUNNER_TEMP/synthetic-project"
          npm run materialize -- --project "$RUNNER_TEMP/synthetic-project"
      - name: Prepare Remotion headless browser
        run: node --input-type=module -e "import {ensureBrowser} from '@remotion/renderer'; const status = await ensureBrowser(); if (status.type === 'no-browser' || status.type === 'version-mismatch') throw new Error(status.type); console.log(status);"
      - name: Render silent regression and real-audio fixture without external speech
        run: npm run test:render
